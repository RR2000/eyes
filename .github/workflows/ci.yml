name: CI

# PRs and main: build and tests (including real WebSockets against the server).
# PRs: the image is built and started once, not pushed.
# main: image pushed to GitHub Container Registry, ghcr.io/rr2000/simple-game:sha-<commit> and :main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=low
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: |
            ghcr.io/rr2000/simple-game:${{ steps.tag.outputs.tag }}
            ghcr.io/rr2000/simple-game:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Eyes: multiplayer eyes that follow the pointer
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # PRs: the image starts, answers on /healthz and serves the page
      - if: github.event_name != 'push'
        run: |
          docker run -d --name eyes -p 8080:8080 ghcr.io/rr2000/simple-game:main
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '/js/client/main.js'
          curl -fsS -o /dev/null http://127.0.0.1:8080/js/shared/game.js
          docker logs eyes
          docker rm -f eyes
